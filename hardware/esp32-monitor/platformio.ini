[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@2.5.43

[env:cyd]
board = esp32dev
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@7.2.1
  tzapu/WiFiManager@2.0.17
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
build_flags =
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_INVERSION_OFF
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D SPI_FREQUENCY=40000000

[env:waveshare-s3-touch-169]
board = esp32-s3-devkitc-1
platform_packages = framework-arduinoespressif32@3.20017.241212
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
  -D SHELF_GOBLIN_WAVESHARE
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_RGB
  ; TFT_eSPI 2.5.43's default S3 register index is invalid with Arduino 2.0.17.
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  -D TFT_MISO=-1
  -D TFT_MOSI=7
  -D TFT_SCLK=6
  -D TFT_CS=5
  -D TFT_DC=4
  -D TFT_RST=8
  -D TFT_BL=15
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_INVERSION_ON
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D SPI_FREQUENCY=40000000
