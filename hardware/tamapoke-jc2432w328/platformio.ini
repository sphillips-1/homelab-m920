[platformio]
default_envs = jc2432w328c
src_dir = .

[env:jc2432w328c]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_src_filter = +<*.cpp> +<TamaPoke.ino>
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
  bodmer/TFT_eSPI@2.5.43
  olikraus/U8g2@2.36.5
build_flags =
  -std=gnu++17
  -D BOARD_JC2432W328
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D TFT_RGB_ORDER=TFT_BGR
  -D USE_HSPI_PORT
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_INVERSION_OFF
  -D SPI_FREQUENCY=40000000

[env:jc2432w328r]
extends = env:jc2432w328c
build_flags =
  ${env:jc2432w328c.build_flags}
  -D JC_TOUCH_RESISTIVE
  -D TOUCH_CS=33
  -D SPI_TOUCH_FREQUENCY=2500000
