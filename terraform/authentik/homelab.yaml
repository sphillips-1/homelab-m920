- attrs:
    execution_logging: true
    expression: |-
      import hashlib
      import hmac
      import os
      import time
      from django.utils import timezone
      from authentik.core.models import Group
      from authentik.stages.invitation.models import Invitation

      user = context.get("pending_user")
      userinfo = context.get("oauth_userinfo", {})
      prompt_data = context.get("prompt_data", {})
      email = (
          userinfo.get("email")
          or prompt_data.get("email")
          or getattr(user, "email", "")
      ).strip().lower()
      email_verified = (
          userinfo.get("email_verified") is True
          or userinfo.get("verified_email") is True
      )
      if not email or not email_verified:
          ak_message("Google did not return a verified email address.")
          return False

      cookie = request.http_request.COOKIES.get("ak_service_invite", "")
      try:
          token, handoff_expiry, supplied_signature = cookie.split(".", 2)
          payload = f"{token}.{handoff_expiry}"
          expected_signature = hmac.new(
              os.environ["AUTHENTIK_INVITATION_PROVISIONER_TOKEN"].encode(),
              payload.encode(),
              hashlib.sha256,
          ).hexdigest()
          valid_handoff = (
              int(handoff_expiry) >= int(time.time())
              and hmac.compare_digest(supplied_signature, expected_signature)
          )
      except (ValueError, KeyError):
          valid_handoff = False

      invitation = None
      if valid_handoff:
          invitation = Invitation.objects.filter(
              pk=token,
              expires__gt=timezone.now(),
              flow__slug="google-source-enrollment",
              fixed_data__services__contains=["audiobookshelf", "calibre-web"],
              fixed_data__reusable_link=True,
          ).first()

      # Ordinary Google enrollment remains pending for manual approval. Only an
      # active bearer-link handoff takes this automatic path.
      if invitation is None:
          return True

      try:
          response = requests.post(
              "http://invitation-provisioner:8080/provision",
              json={
                  "email": email,
                  "name": (
                      getattr(user, "name", "")
                      or userinfo.get("name")
                      or prompt_data.get("name")
                      or email
                  ),
                  "services": invitation.fixed_data.get("services", []),
              },
              headers={
                  "Authorization": "Bearer " + os.environ[
                      "AUTHENTIK_INVITATION_PROVISIONER_TOKEN"
                  ]
              },
              timeout=15,
          )
          response.raise_for_status()
          provisioned = response.json()
          requested_services = set(invitation.fixed_data.get("services", []))
          if not requested_services.issubset(provisioned.keys()):
              raise ValueError("provisioner did not confirm every requested service")
      except Exception as exc:
          ak_logger.warning("Application invitation provisioning failed", error=str(exc))
          ak_message("Application account creation failed. Please retry this invitation.")
          return False

      groups = list(Group.objects.filter(name__in=["audiobooks-users", "books-users"]))
      if len(groups) != 2:
          ak_message("Application access groups are not configured.")
          return False
      if user and not user._state.adding:
          # Existing Google identities use the source-authentication flow and
          # can be approved by the same reusable link.
          user.groups.add(*groups)
      else:
          # New identities are persisted by the User Write stage after this
          # policy; flow context makes creation and approval one operation.
          context["flow_plan"].context["groups"] = groups
      return True
    name: provision-application-invitation
