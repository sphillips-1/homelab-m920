name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-containers:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create validation-only environment files
        run: |
          printf '%s\n' \
            'PG_PASS=ci-not-a-secret' \
            'AUTHENTIK_SECRET_KEY=ci-not-a-secret' \
            > services/authentik/.env
          : > services/authentik/.env.invitation
          cp services/jellyfin/.env.example services/jellyfin/.env
          sed -i 's/REPLACE_WITH_DETECTED_GID/109/' services/jellyfin/.env
      - name: Validate Compose files
        run: |
          set -euo pipefail
          while IFS= read -r compose_file; do
            echo "Validating ${compose_file}"
            docker compose -f "${compose_file}" config --quiet
          done < <(find services -name compose.yml -type f -print | sort)
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - name: Check Audiobookshelf mobile prompt
        run: node --test services/audiobookshelf/mobile-app.test.cjs
      - name: Validate Audiobookshelf gateway
        run: docker run --rm -v "$PWD/services/audiobookshelf/gateway.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.29.1-alpine nginx -t

  terraform:
    needs: validate-containers
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
      AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_tunnel_id: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      TF_VAR_tunnel_name: ${{ vars.CLOUDFLARE_TUNNEL_NAME }}
      TF_VAR_enable_authentik_blueprint: ${{ vars.AUTHENTIK_ADOPTION_READY == 'true' && 'true' || 'false' }}
      TF_VAR_authentik_blueprint_enabled: ${{ vars.AUTHENTIK_BLUEPRINT_ENABLED == 'true' && 'true' || 'false' }}
      AUTHENTIK_BLUEPRINT_NAME: ${{ vars.AUTHENTIK_BLUEPRINT_NAME || 'homelab-terraform' }}
      # Keep false while terraform/authentik.tf ignores blueprint content PUTs.
      AUTHENTIK_BLUEPRINT_CONTENT_MANAGED: "false"
    steps:
      - uses: actions/checkout@v5
      - name: Verify adoption is enabled
        run: test "${{ vars.TF_ADOPTION_READY }}" = "true"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
      - name: Configure remote state
        run: |
          printf '%s\n' \
            'hostname = "app.terraform.io"' \
            'organization = "${{ vars.TF_CLOUD_ORGANIZATION }}"' \
            'workspaces { name = "${{ vars.TF_WORKSPACE }}" }' \
            > backend.ci.hcl
      - run: terraform init
        env:
          TF_CLI_ARGS_init: -backend-config=backend.ci.hcl
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: Reject destructive plans
        run: |
          terraform show -json tfplan > tfplan.json
          if jq -e '[.resource_changes[]? | .change.actions[]?] | any(. == "delete")' tfplan.json; then
            echo "ERROR: Plan contains a delete or replacement action." >&2
            exit 1
          fi
      - run: terraform apply tfplan
      - name: Apply and verify Authentik blueprint
        if: env.AUTHENTIK_BLUEPRINT_CONTENT_MANAGED == 'true' && env.TF_VAR_enable_authentik_blueprint == 'true' && env.TF_VAR_authentik_blueprint_enabled == 'true'
        run: ../scripts/apply-authentik-blueprint.sh

  deploy-containers:
    needs: terraform
    # Add the `m920` label to the existing runner so this cannot land on another
    # self-hosted machine if more runners are registered later.
    runs-on: [self-hosted, linux, x64, m920]
    environment: infrastructure
    timeout-minutes: 45
    steps:
      - name: Report canonical checkout status
        run: git -C /opt/homelab status --short
      - name: Deploy exact main commit
        run: sudo --non-interactive /usr/local/sbin/homelab-deploy "${{ github.sha }}"
