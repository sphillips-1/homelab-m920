name: ESP32 firmware

on:
  push:
    paths:
      - hardware/esp32-monitor/**
      - hardware/cyd-status/**
      - hardware/cyd-pets/**
      - hardware/cyd-ota/**
      - tests/test_esp32_health.cpp
      - tests/test_esp32_touch.cpp
      - tests/test_esp32_deployment.py
      - scripts/esp32_profiles.py
      - scripts/package-esp32-firmware.py
      - scripts/deploy-esp32-firmware.py
      - .github/workflows/esp32-firmware.yml
  pull_request:
    paths:
      - hardware/esp32-monitor/**
      - hardware/cyd-status/**
      - hardware/cyd-pets/**
      - hardware/cyd-ota/**
      - tests/test_esp32_health.cpp
      - tests/test_esp32_touch.cpp
      - tests/test_esp32_deployment.py
      - scripts/esp32_profiles.py
      - scripts/package-esp32-firmware.py
      - scripts/deploy-esp32-firmware.py
      - .github/workflows/esp32-firmware.yml
  workflow_dispatch:
    inputs:
      target:
        description: Display connected to the M920
        type: choice
        default: waveshare-s3-touch-169
        options:
          - waveshare-s3-touch-169
          - cyd
          - cyd-ant
          - cyd-cat
      transport:
        description: Deployment transport (OTA applies only to CYD)
        type: choice
        default: auto
        options:
          - auto
          - usb
          - ota
      provision_wifi:
        description: Save the protected Wi-Fi settings on Cat or Ant over USB
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - target: cyd
            project: hardware/cyd-status
          - target: cyd-ant
            project: hardware/cyd-pets
          - target: cyd-cat
            project: hardware/cyd-pets
          - target: waveshare-s3-touch-169
            project: hardware/esp32-monitor
    env:
      TARGET: ${{ matrix.target }}
      PROJECT: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate firmware workflow
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/esp32-firmware.yml .github/workflows/cyd-download.yml
      - name: Check health thresholds and missing-data behavior
        run: |
          g++ -std=c++14 -Wall -Wextra -pedantic tests/test_esp32_health.cpp -o /tmp/test-esp32-health
          /tmp/test-esp32-health
      - name: Test touch calibration and swipe gestures
        run: |
          g++ -std=c++14 -Wall -Wextra -pedantic tests/test_esp32_touch.cpp -o /tmp/test-esp32-touch
          /tmp/test-esp32-touch
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Test artifact integrity, board identity and rollback
        run: python -B tests/test_esp32_deployment.py
      - name: Build display firmware
        run: pio run -d "$PROJECT" -e "$TARGET"
      - name: Compile Cat and Ant firmware
        if: matrix.target == 'waveshare-s3-touch-169'
        run: pio run -d "$PROJECT" -e waveshare-cat -e waveshare-ant
      - name: Package flash images for this commit
        run: |
          python scripts/package-esp32-firmware.py \
            --build "$PROJECT/.pio/build/$TARGET" --target "$TARGET" \
            --boot-app "$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            --output firmware-package --sha "$GITHUB_SHA"
          if [[ "$TARGET" == cyd* ]]; then
            cp "$HOME/.platformio/packages/framework-arduinoespressif32/tools/espota.py" firmware-package/
          fi
      - name: Save firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shelf-goblin-firmware-${{ matrix.target }}-${{ github.sha }}
          path: firmware-package/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, m920]
    environment: infrastructure
    timeout-minutes: 35
    concurrency:
      group: esp32-usb-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the connected display target
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          REQUESTED_TRANSPORT: ${{ inputs.transport }}
          CYD_OTA_HOST: ${{ vars.CYD_OTA_HOST }}
          CYD_ANT_OTA_HOST: ${{ vars.CYD_ANT_OTA_HOST }}
          CYD_CAT_OTA_HOST: ${{ vars.CYD_CAT_OTA_HOST }}
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          target="${REQUESTED_TARGET:-waveshare-s3-touch-169}"
          if [[ "$GITHUB_EVENT_NAME" == push ]] &&
             git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null &&
             ! git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- hardware/cyd-pets; then
            echo "TRANSPORT=skip" >> "$GITHUB_ENV"
            echo 'CYD pet firmware changes require an explicit deployment target.'
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == push ]] &&
             git cat-file -e "$PREVIOUS_SHA^{commit}" 2>/dev/null &&
             git diff --quiet "$PREVIOUS_SHA" "$GITHUB_SHA" -- hardware/esp32-monitor &&
             [[ -n "$(git diff --name-only "$PREVIOUS_SHA" "$GITHUB_SHA" -- hardware/cyd-status)" ]]; then
            target=cyd
          fi
          transport="${REQUESTED_TRANSPORT:-auto}"
          if [[ "$transport" == auto ]]; then
            transport=usb
            if [[ "$target" == cyd && -n "$CYD_OTA_HOST" ]]; then transport=ota; fi
            if [[ "$target" == cyd-ant && -n "$CYD_ANT_OTA_HOST" ]]; then transport=ota; fi
            if [[ "$target" == cyd-cat && -n "$CYD_CAT_OTA_HOST" ]]; then transport=ota; fi
          fi
          if [[ "$transport" == ota && "$target" != cyd* ]]; then
            echo 'OTA is only supported for CYD.' >&2
            exit 1
          fi
          echo "TARGET=$target" >> "$GITHUB_ENV"
          echo "TRANSPORT=$transport" >> "$GITHUB_ENV"
      - name: Refuse an obsolete firmware build
        if: env.TRANSPORT != 'skip'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          project=hardware/esp32-monitor
          if [[ "$TARGET" == cyd ]]; then project=hardware/cyd-status; fi
          if [[ "$TARGET" == cyd-* ]]; then project=hardware/cyd-pets; fi
          latest=$(git log -1 --format=%H origin/main -- "$project" hardware/cyd-ota hardware/esp32-monitor/src/health.h hardware/esp32-monitor/src/combat.h hardware/esp32-monitor/src/evolution.h hardware/esp32-monitor/src/display_link.h hardware/esp32-monitor/src/scene_art.h hardware/esp32-monitor/src/pet_scene.h hardware/esp32-monitor/src/virtual_pet_art.h hardware/esp32-monitor/deploy tests/test_esp32_health.cpp tests/test_esp32_touch.cpp tests/test_esp32_deployment.py scripts/package-esp32-firmware.py scripts/esp32_profiles.py scripts/deploy-esp32-firmware.py .github/workflows/esp32-firmware.yml)
          git merge-base --is-ancestor "$latest" "$GITHUB_SHA" || { echo 'A newer firmware change is already on main; deploy the newer run.' >&2; exit 1; }
      - name: Download verified firmware from this run
        if: env.TRANSPORT != 'skip'
        uses: actions/download-artifact@v4
        with:
          name: shelf-goblin-firmware-${{ env.TARGET }}-${{ github.sha }}
          path: firmware-package
      - name: Build isolated ESP32 flasher
        if: env.TRANSPORT != 'skip'
        run: docker build -f hardware/esp32-monitor/deploy/Dockerfile -t "homelab-esp32-flasher:$GITHUB_SHA" .
      - name: Upload firmware over the LAN
        if: env.TRANSPORT == 'ota'
        env:
          CYD_OTA_HOST: ${{ vars.CYD_OTA_HOST }}
          CYD_OTA_KEY: ${{ secrets.CYD_OTA_KEY }}
          CYD_ANT_OTA_HOST: ${{ vars.CYD_ANT_OTA_HOST }}
          CYD_ANT_OTA_KEY: ${{ secrets.CYD_ANT_OTA_KEY }}
          CYD_CAT_OTA_HOST: ${{ vars.CYD_CAT_OTA_HOST }}
          CYD_CAT_OTA_KEY: ${{ secrets.CYD_CAT_OTA_KEY }}
        run: |
          if [[ "$TARGET" == cyd-ant ]]; then
            export CYD_OTA_HOST="$CYD_ANT_OTA_HOST" CYD_OTA_KEY="$CYD_ANT_OTA_KEY"
          elif [[ "$TARGET" == cyd-cat ]]; then
            export CYD_OTA_HOST="$CYD_CAT_OTA_HOST" CYD_OTA_KEY="$CYD_CAT_OTA_KEY"
          fi
          docker run --rm --read-only --network host \
            --cap-drop ALL --security-opt no-new-privileges \
            --env CYD_OTA_HOST --env CYD_OTA_KEY \
            --mount "type=bind,source=$GITHUB_WORKSPACE/firmware-package,target=/firmware,readonly" \
            "homelab-esp32-flasher:$GITHUB_SHA" --target "$TARGET" --sha "$GITHUB_SHA" --ota
          printf '### CYD OTA upload accepted\n\nCommit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Back up, flash, verify and check boot
        if: env.TRANSPORT == 'usb'
        shell: bash
        env:
          CYD_OTA_KEY: ${{ secrets.CYD_OTA_KEY }}
          CYD_ANT_OTA_KEY: ${{ secrets.CYD_ANT_OTA_KEY }}
          CYD_ANT_SERIAL_DEVICE: ${{ vars.CYD_ANT_SERIAL_DEVICE }}
          CYD_CAT_OTA_KEY: ${{ secrets.CYD_CAT_OTA_KEY }}
          CYD_CAT_SERIAL_DEVICE: ${{ vars.CYD_CAT_SERIAL_DEVICE }}
          PROVISION_WIFI: ${{ inputs.provision_wifi }}
          CYD_WIFI_SSID: ${{ inputs.provision_wifi && secrets.CYD_WIFI_SSID || '' }}
          CYD_WIFI_PASSWORD: ${{ inputs.provision_wifi && secrets.CYD_WIFI_PASSWORD || '' }}
          WAVESHARE_SERIAL_DEVICE: ${{ vars.WAVESHARE_SERIAL_DEVICE || '/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_28:84:85:55:4C:1C-if00' }}
          WAVESHARE_MAC: ${{ vars.WAVESHARE_MAC || '28:84:85:55:4c:1c' }}
          ESP32_SERIAL_DEVICE: ${{ vars.ESP32_SERIAL_DEVICE || '/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0' }}
          ESP32_MAC: ${{ vars.ESP32_MAC || '48:9d:31:c0:27:5c' }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == waveshare-s3-touch-169 ]]; then
            serial="$WAVESHARE_SERIAL_DEVICE"
            mac="$WAVESHARE_MAC"
          elif [[ "$TARGET" == cyd-ant ]]; then
            serial="$CYD_ANT_SERIAL_DEVICE"
            mac='68:09:47:85:c6:d8'
            export CYD_OTA_KEY="$CYD_ANT_OTA_KEY"
          elif [[ "$TARGET" == cyd-cat ]]; then
            serial="$CYD_CAT_SERIAL_DEVICE"
            mac='68:09:47:85:8e:cc'
            export CYD_OTA_KEY="$CYD_CAT_OTA_KEY"
          else
            serial="$ESP32_SERIAL_DEVICE"
            mac="$ESP32_MAC"
          fi
          [[ "$serial" =~ ^/dev/serial/(by-id|by-path)/[^/]+$ ]] ||
            { echo 'Use a stable USB by-id or by-path device path.' >&2; exit 1; }
          device=$(readlink -e -- "$serial")
          [[ -c "$device" ]] || { echo 'ESP32 USB serial device is unavailable.' >&2; exit 1; }

          if [[ "$TARGET" == waveshare-s3-touch-169 ]]; then
            [[ "$device" =~ ^/dev/ttyACM[0-9]+$ ]] ||
              { echo 'Expected a native USB ACM device.' >&2; exit 1; }
            # Track the same by-id link across USB resets, even if the ACM minor changes.
            device_args=(--device-cgroup-rule 'c 166:* rw'
              --mount "type=bind,source=/dev,target=/host-dev,readonly")
            port="/host-dev/${serial#/dev/}"
          else
            device_args=(--device "$device:/dev/esp32:rw")
            device_args+=(--env CYD_OTA_KEY)
            port=/dev/esp32
          fi
          provision_args=()
          if [[ "$PROVISION_WIFI" == true ]]; then
            device_args+=(--env CYD_WIFI_SSID --env CYD_WIFI_PASSWORD)
            provision_args+=(--provision-wifi)
          fi

          docker run --rm --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            "${device_args[@]}" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/firmware-package,target=/firmware,readonly" \
            --mount type=bind,source=/srv/homelab/backups,target=/backups \
            "homelab-esp32-flasher:$GITHUB_SHA" --target "$TARGET" --port "$port" --mac "$mac" --sha "$GITHUB_SHA" "${provision_args[@]}"
          printf '### ESP32 deployed\n\nCommit: %s\n\nUSB flash verification and serial boot check passed. Private backups remain on the M920Q under /srv/homelab/backups/esp32.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
