name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTHENTIK_URL: ${{ vars.AUTHENTIK_URL }}
      AUTHENTIK_TOKEN: ${{ secrets.AUTHENTIK_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_tunnel_id: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      TF_VAR_tunnel_name: ${{ vars.CLOUDFLARE_TUNNEL_NAME }}
      TF_VAR_enable_authentik_blueprint: ${{ vars.AUTHENTIK_ADOPTION_READY == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify adoption is enabled
        run: test "${{ vars.TF_ADOPTION_READY }}" = "true"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
      - name: Configure remote state
        run: |
          printf '%s\n' \
            'hostname = "app.terraform.io"' \
            'organization = "${{ vars.TF_CLOUD_ORGANIZATION }}"' \
            'workspaces { name = "${{ vars.TF_WORKSPACE }}" }' \
            > backend.ci.hcl
      - run: terraform init
        env:
          TF_CLI_ARGS_init: -backend-config=backend.ci.hcl
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: Reject destructive plans
        run: |
          terraform show -json tfplan > tfplan.json
          if jq -e '[.resource_changes[]? | .change.actions[]?] | any(. == "delete")' tfplan.json; then
            echo "ERROR: Plan contains a delete or replacement action." >&2
            exit 1
          fi
      - run: terraform apply tfplan
