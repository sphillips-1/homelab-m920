name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      allow_access_decommission:
        description: Allow only the reviewed Cloudflare Access test/Calibre cleanup
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: terraform-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_tunnel_id: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      TF_VAR_tunnel_name: ${{ vars.CLOUDFLARE_TUNNEL_NAME }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify adoption is enabled
        run: test "${{ vars.TF_ADOPTION_READY }}" = "true"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
      - name: Configure remote state
        run: |
          printf '%s\n' \
            'hostname = "app.terraform.io"' \
            'organization = "${{ vars.TF_CLOUD_ORGANIZATION }}"' \
            'workspaces { name = "${{ vars.TF_WORKSPACE }}" }' \
            > backend.ci.hcl
      - run: terraform init
        env:
          TF_CLI_ARGS_init: -backend-config=backend.ci.hcl
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - name: Reject destructive plans
        env:
          ALLOW_ACCESS_DECOMMISSION: ${{ inputs.allow_access_decommission }}
        run: |
          terraform show -json tfplan > tfplan.json
          if jq -e '.resource_changes[]? | select((.change.actions | index("delete")) and (.change.actions | index("create")))' tfplan.json >/dev/null; then
            echo "ERROR: Plan contains a replacement action." >&2
            exit 1
          fi

          mapfile -t deletes < <(jq -r '.resource_changes[]? | select(.change.actions == ["delete"]) | .address' tfplan.json | sort)
          if (( ${#deletes[@]} == 0 )); then
            exit 0
          fi

          expected=(
            'cloudflare_dns_record.audiobookshelf_access_test[0]'
            'cloudflare_zero_trust_access_application.audiobookshelf_test[0]'
            'cloudflare_zero_trust_access_application.calibre_web[0]'
            'cloudflare_zero_trust_access_identity_provider.otp'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)

          if [[ "${ALLOW_ACCESS_DECOMMISSION}" != "true" ]] || [[ "${deletes[*]}" != "${expected[*]}" ]]; then
            printf 'ERROR: Unapproved delete set:\n%s\n' "${deletes[*]}" >&2
            exit 1
          fi
      - run: terraform apply tfplan
