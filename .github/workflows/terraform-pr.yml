name: Terraform PR

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_zone_name: ${{ vars.CLOUDFLARE_ZONE_NAME }}
      TF_VAR_tunnel_id: ${{ vars.CLOUDFLARE_TUNNEL_ID }}
      TF_VAR_tunnel_name: ${{ vars.CLOUDFLARE_TUNNEL_NAME }}
      TF_VAR_enable_calibre_access: "true"
      TF_VAR_access_session_duration: ${{ vars.ACCESS_SESSION_DURATION }}
      TF_VAR_access_users: ${{ secrets.TF_VAR_ACCESS_USERS }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify adoption is enabled
        run: test "${{ vars.TF_ADOPTION_READY }}" = "true"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: Configure remote state
        run: |
          printf '%s\n' \
            'hostname = "app.terraform.io"' \
            'organization = "${{ vars.TF_CLOUD_ORGANIZATION }}"' \
            'workspaces { name = "${{ vars.TF_WORKSPACE }}" }' \
            > backend.ci.hcl
      - run: terraform init
        env:
          TF_CLI_ARGS_init: -backend-config=backend.ci.hcl
      - name: Plan
        run: terraform plan -out=tfplan
      - name: Reject destructive plans
        run: |
          terraform show -json tfplan > tfplan.json
          if jq -e '[.resource_changes[]? | .change.actions[]?] | any(. == "delete")' tfplan.json; then
            echo "ERROR: Plan contains a delete or replacement action." >&2
            exit 1
          fi
