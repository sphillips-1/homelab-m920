name: Authentik Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

# Share the deployment lock so inspection does not overlap a deployment job.
concurrency:
  group: production-containers
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, m920]
    environment: infrastructure
    timeout-minutes: 10
    steps:
      # No checkout, deploy, restart, credential changes, or raw log uploads.
      # Keep this self-contained: adding scripts would trigger Container Deploy.
      - name: Read container state and classify OAuth failures
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import re
          import subprocess

          def run(args, data=None):
              try:
                  return subprocess.run(args, input=data, text=True, capture_output=True, timeout=90)
              except (OSError, subprocess.TimeoutExpired):
                  return None

          def emit(label, value):
              print(json.dumps({"check": label, "result": value}), flush=True)

          emit("runner_utc", datetime.datetime.now(datetime.timezone.utc).isoformat())
          docker = None
          for command in (["docker"], ["sudo", "-n", "docker"]):
              result = run(command + ["ps", "--format", "{{.ID}}"])
              if result is not None and result.returncode == 0:
                  docker = command
                  break
          if docker is None:
              emit("docker_access", "unavailable; deployment-only sudo may be installed")
              raise SystemExit(1)
          emit("docker_access", "available")

          revision = run(["git", "-c", "safe.directory=/opt/homelab", "-C", "/opt/homelab", "rev-parse", "HEAD"])
          if revision is not None and re.fullmatch(r"[0-9a-f]{40}\s*", revision.stdout):
              emit("deployed_commit", revision.stdout.strip())

          names = ("authentik-server", "authentik-worker", "authentik-postgresql", "cloudflared", "audiobookshelf", "audiobookshelf-gateway")
          for name in names:
              result = run(docker + ["inspect", name])
              if result is None or result.returncode:
                  emit(name, "inspect unavailable")
                  continue
              try:
                  item = json.loads(result.stdout)[0]
                  state = item["State"]
                  emit(name, {
                      "image": item["Config"]["Image"],
                      "image_id": item["Image"],
                      "status": state["Status"],
                      "health": state.get("Health", {}).get("Status"),
                      "restarts": item["RestartCount"],
                      "started_at": state["StartedAt"],
                  })
              except (KeyError, ValueError, IndexError, TypeError):
                  emit(name, "unexpected inspect schema")

          # Classify only known error markers. Never publish raw exception strings,
          # response bodies, callback URLs, cookies, codes, or arbitrary log fields.
          markers = (
              "invalid_client", "invalid_grant", "redirect_uri_mismatch",
              "unauthorized_client", "invalid_request", "access_denied",
              "NameResolutionError", "gaierror", "Temporary failure in name resolution",
              "SSLError", "CERTIFICATE_VERIFY_FAILED", "ConnectTimeout",
              "ReadTimeout", "ProxyError", "ConnectionError",
              "Application state check failed", "No state stored in the session",
          )
          for name in ("authentik-server", "authentik-worker", "cloudflared"):
              result = run(docker + ["logs", "--since", "48h", "--tail", "20000", name])
              if result is None or result.returncode:
                  emit(name + "_logs", "unavailable")
                  continue
              counts = {}
              matches = []
              for line in (result.stdout + "\n" + result.stderr).splitlines():
                  for marker in markers:
                      if marker in line:
                          counts[marker] = counts.get(marker, 0) + 1
                  if "Unable to fetch access token" not in line and "Could not retrieve token" not in line:
                      continue
                  row = {"event": "token_exchange_failure", "markers": [m for m in markers if m in line]}
                  try:
                      event = json.loads(line)
                      timestamp = str(event.get("timestamp", ""))
                      request_id = str(event.get("request_id", ""))
                      if re.fullmatch(r"[0-9T:.+Z -]{10,40}", timestamp):
                          row["timestamp"] = timestamp
                      if re.fullmatch(r"[0-9a-f-]{16,36}", request_id):
                          row["request_id"] = request_id
                  except (ValueError, AttributeError):
                      pass
                  matches.append(row)
              emit(name + "_log_markers", counts)
              emit(name + "_token_failure_count", len(matches))
              emit(name + "_recent_token_failures", matches[-20:])

          # Run inside each Authentik container, using its inherited proxy/CA env.
          # GET requests only; no OAuth credentials or authorization codes sent.
          network_probe = '''
          import datetime, json, os, socket
          import requests
          def report(name, value):
              print(json.dumps({"check": name, "result": value}))
          report("container_utc", datetime.datetime.now(datetime.timezone.utc).isoformat())
          report("outbound_environment_present", [key for key in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY", "NO_PROXY", "http_proxy", "https_proxy", "all_proxy", "no_proxy", "REQUESTS_CA_BUNDLE", "SSL_CERT_FILE") if os.environ.get(key)])
          for host in ("accounts.google.com", "oauth2.googleapis.com"):
              try:
                  socket.getaddrinfo(host, 443)
                  report(host + "_dns", "resolved")
              except OSError:
                  report(host + "_dns", "failed")
          for url in ("https://accounts.google.com/.well-known/openid-configuration", "https://oauth2.googleapis.com/token"):
              try:
                  response = requests.get(url, timeout=15, allow_redirects=False)
                  report(url, {"status": response.status_code, "tls_validated": True})
              except requests.RequestException as exc:
                  report(url, {"error_type": type(exc).__name__})
          '''
          for name in ("authentik-server", "authentik-worker"):
              result = run(docker + ["exec", "-i", name, "python", "-"], network_probe)
              if result is None or result.returncode:
                  emit(name + "_network", "probe unavailable")
                  continue
              # Only accept structured output from our probe; suppress startup logs.
              for line in result.stdout.splitlines():
                  try:
                      row = json.loads(line)
                      if isinstance(row, dict) and set(row) == {"check", "result"}:
                          emit(name + "_network", row)
                  except ValueError:
                      pass
          PY
      - name: Verify resolver candidate and repair prerequisites
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def run(args, data=None):
              try:
                  return subprocess.run(args, input=data, text=True, capture_output=True, timeout=90)
              except (OSError, subprocess.TimeoutExpired):
                  return None
          def emit(check, result):
              print(json.dumps({"check": check, "result": result}), flush=True)
          docker = None
          for command in (["docker"], ["sudo", "-n", "docker"]):
              result = run(command + ["ps", "--format", "{{.ID}}"])
              if result is not None and result.returncode == 0:
                  docker = command
                  break
          if docker is None:
              raise SystemExit("Docker access unavailable")
          for file in ("compose.yml", ".env", ".env.invitation"):
              path = Path("/opt/homelab/services/authentik") / file
              emit(file + "_permissions", {"readable": os.access(path, os.R_OK), "writable": os.access(path, os.W_OK)})
          result = run(["sudo", "-n", "true"])
          emit("sudo_true_available", result is not None and result.returncode == 0)
          result = run(["git", "-c", "safe.directory=/opt/homelab", "-C", "/opt/homelab", "diff", "--quiet", "HEAD", "--", "services/authentik/compose.yml"])
          emit("authentik_compose_matches_HEAD", result is not None and result.returncode == 0)
          source_probe = '''
          import json, os
          from authentik.sources.oauth.models import OAuthSource
          for source in OAuthSource.objects.all():
              if source.source_type.name != "google":
                  continue
              value = {"slug": source.slug, "enabled": source.enabled,
                  "client_id_present": bool(source.consumer_key), "client_secret_present": bool(source.consumer_secret),
                  "client_id_matches_env": source.consumer_key == os.environ.get("AUTHENTIK_GOOGLE_CLIENT_ID"),
                  "client_secret_matches_env": source.consumer_secret == os.environ.get("AUTHENTIK_GOOGLE_CLIENT_SECRET"),
                  "authorization_url": source.source_type.authorization_url,
                  "token_url": source.source_type.access_token_url,
                  "authentication_flow": source.authentication_flow.slug if source.authentication_flow else None,
                  "enrollment_flow": source.enrollment_flow.slug if source.enrollment_flow else None}
              print("SOURCE_RESULT=" + json.dumps(value))
          '''
          result = run(docker + ["exec", "-i", "authentik-server", "ak", "shell"], source_probe)
          found = False
          if result is not None and result.returncode == 0:
              for line in result.stdout.splitlines():
                  if line.startswith("SOURCE_RESULT="):
                      emit("google_source", json.loads(line.removeprefix("SOURCE_RESULT=")))
                      found = True
          if not found:
              emit("google_source", "probe unavailable; no raw shell output published")
          for name in ("authentik-server", "authentik-worker", "audiobookshelf"):
              result = run(docker + ["inspect", "--format", "{{json .HostConfig.Dns}}", name])
              if result is not None and result.returncode == 0:
                  emit(name + "_explicit_dns", json.loads(result.stdout))
          probe = '''
          import json, socket, struct
          from pathlib import Path
          import requests
          def emit(check, result):
              print(json.dumps({"check": check, "result": result}))
          emit("resolv_nameservers", [line.split()[1] for line in Path("/etc/resolv.conf").read_text().splitlines() if line.startswith("nameserver ")])
          def resolve(host):
              labels = b"".join(bytes([len(x)]) + x.encode("ascii") for x in host.split(".")) + b"\\0"
              query = struct.pack("!6H", 18432, 256, 1, 0, 0, 0) + labels + struct.pack("!2H", 1, 1)
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as sock:
                  sock.settimeout(5)
                  sock.connect(("192.168.4.75", 53))
                  sock.send(query)
                  data = sock.recv(4096)
              ident, flags, questions, answers, _, _ = struct.unpack("!6H", data[:12])
              if ident != 18432 or flags & 15 or flags & 512 or not flags & 32768:
                  raise ValueError("unusable DNS response")
              def skip_name(pos):
                  while data[pos]:
                      if data[pos] & 192 == 192:
                          return pos + 2
                      pos += 1 + data[pos]
                  return pos + 1
              pos = 12
              for _ in range(questions):
                  pos = skip_name(pos) + 4
              addresses = []
              for _ in range(answers):
                  pos = skip_name(pos)
                  kind, cls, ttl, size = struct.unpack("!HHIH", data[pos:pos+10])
                  pos += 10
                  if kind == 1 and cls == 1 and size == 4:
                      addresses.append(socket.inet_ntoa(data[pos:pos+4]))
                  pos += size
              if not addresses:
                  raise ValueError("no IPv4 answers")
              return addresses
          answers = {}
          for host in ("accounts.google.com", "oauth2.googleapis.com"):
              try:
                  answers[host] = resolve(host)
                  emit(host + "_pihole", "resolved")
              except (OSError, ValueError, IndexError, struct.error) as exc:
                  emit(host + "_pihole", type(exc).__name__)
          original = socket.getaddrinfo
          def candidate(host, port, *args, **kwargs):
              if host in answers:
                  return original(answers[host][0], port, *args, **kwargs)
              return original(host, port, *args, **kwargs)
          socket.getaddrinfo = candidate
          for host, path in (("accounts.google.com", "/.well-known/openid-configuration"), ("oauth2.googleapis.com", "/token")):
              if host not in answers:
                  continue
              try:
                  response = requests.get("https://" + host + path, timeout=10, allow_redirects=False)
                  emit(host + "_candidate_https", {"status": response.status_code, "tls_validated": True})
              except requests.RequestException as exc:
                  emit(host + "_candidate_https", type(exc).__name__)
          '''
          for name in ("authentik-server", "authentik-worker"):
              result = run(docker + ["exec", "-i", name, "python", "-"], probe)
              if result is None or result.returncode:
                  emit(name + "_candidate", "probe unavailable")
                  continue
              for line in result.stdout.splitlines():
                  try:
                      row = json.loads(line)
                      if isinstance(row, dict) and set(row) == {"check", "result"}:
                          emit(name + "_candidate", row)
                  except ValueError:
                      pass
          PY
