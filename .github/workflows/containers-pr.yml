name: Container PR

on:
  pull_request:
    paths:
      - "services/**"
      - "scripts/**"
      - ".github/workflows/containers-*.yml"

permissions:
  contents: read

concurrency:
  group: containers-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create validation-only environment files
        run: |
          printf '%s\n' \
            'PG_PASS=ci-not-a-secret' \
            'AUTHENTIK_SECRET_KEY=ci-not-a-secret' \
            > services/authentik/.env
          : > services/authentik/.env.invitation
      - name: Validate Compose files
        run: |
          set -euo pipefail
          while IFS= read -r compose_file; do
            echo "Validating ${compose_file}"
            docker compose -f "${compose_file}" config --quiet
          done < <(find services -name compose.yml -type f -print | sort)
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
