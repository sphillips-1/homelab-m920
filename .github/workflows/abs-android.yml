name: ShelfGoblin Android
on:
  workflow_dispatch:
  push:
    paths: ['clients/abs-android/**', 'services/authentik/branding/**', '.github/workflows/abs-android.yml']
  pull_request:
    paths: ['clients/abs-android/**', 'services/authentik/branding/**', '.github/workflows/abs-android.yml']
permissions:
  contents: read
concurrency:
  group: shelfgoblin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare pinned client and test grouping
        run: |
          node clients/abs-android/prepare.cjs
          node --test clients/abs-android/tree.test.cjs clients/abs-android/auth.test.cjs
          python3 -B clients/abs-android/notify-release.test.py
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Install web and browser test dependencies
        run: |
          npm ci --prefix clients/abs-android --no-audit --no-fund
          npm ci --prefix clients/abs-android/upstream --no-audit --no-fund
          cd clients/abs-android
          npx playwright install --with-deps chromium
          node ui.test.cjs
      - name: Build web layer
        working-directory: clients/abs-android/upstream
        run: |
          npm run generate
          npx cap sync android
      - name: Build installable debug APK
        env:
          DEBUG_KEYSTORE: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/shelfgoblin-android')) && secrets.SHELFGOBLIN_DEBUG_KEYSTORE_BASE64 || '' }}
          SIGNING_CERT_SHA256: ${{ vars.SHELFGOBLIN_SIGNING_CERT_SHA256 }}
        working-directory: clients/abs-android/upstream/android
        run: |
          signing_args=()
          if [[ "$GITHUB_EVENT_NAME" != pull_request && ( "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/codex/shelfgoblin-android ) ]]; then
            test -n "$DEBUG_KEYSTORE" || { echo 'Configure SHELFGOBLIN_DEBUG_KEYSTORE_BASE64 before publishing.' >&2; exit 1; }
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            test -n "$SIGNING_CERT_SHA256" || { echo 'Configure SHELFGOBLIN_SIGNING_CERT_SHA256 before publishing.' >&2; exit 1; }
            restored_cert=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test "$restored_cert" = "$SIGNING_CERT_SHA256" || { echo 'Restored signing certificate mismatch.' >&2; exit 1; }
            signing_args+=("-PshelfgoblinDebugKeystore=$HOME/.android/debug.keystore")
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PshelfgoblinVersionCode=$((1000 + GITHUB_RUN_NUMBER)) \
            -PshelfgoblinVersionName="0.14.2-shelfgoblin.${GITHUB_RUN_NUMBER}" "${signing_args[@]}"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          if (( ${#signing_args[@]} )); then
            apk_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$apk_cert" = "$SIGNING_CERT_SHA256" || { echo 'Built APK signing certificate mismatch.' >&2; exit 1; }
          fi
      - name: Assemble phone download and matching source
        run: |
          mkdir -p clients/abs-android/artifacts/release
          cp clients/abs-android/upstream/android/app/build/outputs/apk/debug/app-debug.apk clients/abs-android/artifacts/release/ShelfGoblin.apk
          git archive --format=tar.gz -o clients/abs-android/artifacts/release/ShelfGoblin-customization.tar.gz HEAD clients/abs-android services/authentik/branding
          git -C clients/abs-android/upstream archive --format=tar.gz -o ../artifacts/release/Audiobookshelf-upstream.tar.gz HEAD
          cd clients/abs-android/artifacts/release
          sha256sum ShelfGoblin.apk ShelfGoblin-customization.tar.gz Audiobookshelf-upstream.tar.gz > SHA256SUMS
          echo "APK: ShelfGoblin.apk (install over the previous ShelfGoblin debug build)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ShelfGoblin-debug-apk
          path: clients/abs-android/artifacts/release/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/shelfgoblin-android')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShelfGoblin-debug-apk
          path: release
      - name: Publish phone download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="shelfgoblin-build-${BUILD_RUN}"
          printf 'Android test build with the Author/Series tree and Authentik-inspired theme.\n\nDownload ShelfGoblin.apk directly on your phone and install over the previous ShelfGoblin debug build.\n\nMatching source archives and SHA256SUMS are included. Full source: %s/tree/%s\nBuild: %s\n' "https://github.com/$GH_REPO" "$BUILD_SHA" "$RUN_URL" > release-notes.md
          gh release create "$tag" release/* --target "$BUILD_SHA" --prerelease --title "ShelfGoblin Android build ${BUILD_RUN}" --notes-file release-notes.md
          echo "[Download APK](https://github.com/$GH_REPO/releases/download/$tag/ShelfGoblin.apk)" >> "$GITHUB_STEP_SUMMARY"
  notify-discord:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Notify releases-mobile
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_MOBILE_WEBHOOK }}
        run: python3 clients/abs-android/notify-release.py
