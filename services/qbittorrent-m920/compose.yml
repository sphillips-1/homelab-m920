services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    container_name: m920-qbittorrent
    restart: unless-stopped
    stop_grace_period: 60s
    # Keep external DNS available even if Docker starts before DHCP writes resolv.conf.
    dns:
      - 192.168.4.75
    healthcheck:
      test: ["CMD-SHELL", "getent hosts www.debian.org >/dev/null && curl --fail --silent --max-time 5 http://127.0.0.1:8080/api/v2/app/version >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    entrypoint: ["/bin/bash", "/storage-entrypoint.sh"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      UMASK: "027"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    networks:
      - homelab
    volumes:
      - /srv/homelab/appdata/qbittorrent-m920:/config
      - type: bind
        source: /srv/homelab/media/torrents-m920
        target: /downloads
        bind:
          create_host_path: false
      - ./storage-entrypoint.sh:/storage-entrypoint.sh:ro
  gateway:
    image: nginx:1.28-alpine
    container_name: qbittorrent-gateway
    restart: unless-stopped
    network_mode: service:qbittorrent
    depends_on:
      qbittorrent:
        condition: service_healthy
        restart: true
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  audiobook-importer:
    image: python:3.13-alpine
    container_name: audiobook-importer
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    network_mode: service:qbittorrent
    depends_on:
      qbittorrent:
        condition: service_healthy
        restart: true
    env_file:
      - ../authentik/.env.invitation
    command: ["python", "-B", "/app/importer.py"]
    volumes:
      - ./importer.py:/app/importer.py:ro
      - ./import.html:/app/import.html:ro
      - ./import.js:/app/import.js:ro
      - ./import.css:/app/import.css:ro
      - type: bind
        source: /srv/homelab/media/torrents-m920
        target: /downloads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/homelab/media/audiobooks/Books
        target: /library
        bind:
          create_host_path: false
      - type: bind
        source: /srv/homelab/storage/.audiobook-imports
        target: /staging
        bind:
          create_host_path: false
      - type: bind
        source: /srv/homelab/appdata/audiobook-importer
        target: /state
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  homelab:
    external: true
