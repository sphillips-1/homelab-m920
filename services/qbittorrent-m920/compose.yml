services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    container_name: m920-qbittorrent
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      UMASK: "027"
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    networks:
      - homelab
    volumes:
      - /srv/homelab/appdata/qbittorrent-m920:/config
      - /srv/homelab/media/torrents-m920:/downloads
  gateway:
    image: nginx:1.28-alpine
    container_name: qbittorrent-gateway
    restart: unless-stopped
    network_mode: service:qbittorrent
    depends_on:
      - qbittorrent
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  homelab:
    external: true
