map $http_authorization $audiobook_downloader_authorized {
    default 0;
    include /etc/nginx/audiobook-auth/bearer.conf;
}

server {
    listen 8093;
    client_max_body_size 11m;

    proxy_set_header Host torrents.shelfgoblin.dev;
    proxy_set_header Referer https://torrents.shelfgoblin.dev/;
    proxy_set_header Origin "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";

    location = /api/v2/torrents/info {
        if ($audiobook_downloader_authorized = 0) { return 403; }
        if ($request_method != GET) { return 405; }
        proxy_pass http://127.0.0.1:8080/api/v2/torrents/info;
    }

    location = /api/v2/torrents/add {
        if ($audiobook_downloader_authorized = 0) { return 403; }
        if ($request_method != POST) { return 405; }
        proxy_pass http://127.0.0.1:8080/api/v2/torrents/add;
    }

    location / { return 404; }
}
