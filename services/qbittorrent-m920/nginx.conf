# qBittorrent listens only on loopback in this shared network namespace.
# Every application/API request must pass Authentik before localhost bypass.
server {
    listen 8091;
    server_name torrents.shelfgoblin.dev;
    client_max_body_size 50m;
    resolver 127.0.0.11 valid=30s;
    set $authentik http://authentik-server:9000;
    location = /imports {
        return 302 https://torrents.shelfgoblin.dev/imports/;
    }
    location /imports/ {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        auth_request_set $import_email $upstream_http_x_authentik_email;
        auth_request_set $import_groups $upstream_http_x_authentik_groups;
        add_header Set-Cookie $auth_cookie;
        proxy_set_header X-Authentik-Email $import_email;
        proxy_set_header X-Authentik-Groups $import_groups;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8092;
    }
    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;
        error_page 401 = @signin;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host torrents.shelfgoblin.dev;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto https;
    }
    location /outpost.goauthentik.io {
        proxy_pass $authentik$uri$is_args$args;
        proxy_set_header Host torrents.shelfgoblin.dev;
        proxy_set_header X-Original-URL https://torrents.shelfgoblin.dev$request_uri;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location @signin {
        internal;
        add_header Set-Cookie $auth_cookie;
        return 302 https://torrents.shelfgoblin.dev/outpost.goauthentik.io/start?rd=$request_uri;
    }
}
