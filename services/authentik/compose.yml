services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - /srv/homelab/appdata/authentik/postgresql:/var/lib/postgresql/data
    networks:
      - authentik-internal

  server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    container_name: authentik-server
    restart: unless-stopped
    command: server
    env_file:
      - .env
      - .env.invitation
    environment: &authentik-environment
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      # Private recovery path only; do not forward this port on the router.
      - "${AUTHENTIK_RECOVERY_BIND:-0.0.0.0}:9000:9000"
    volumes:
      - /srv/homelab/appdata/authentik/data:/data
      - /srv/homelab/appdata/authentik/custom-templates:/templates
    networks:
      - authentik-internal
      - homelab

  worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.5.6}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    env_file:
      - .env
      - .env.invitation
    environment:
      <<: *authentik-environment
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - /srv/homelab/appdata/authentik/data:/data
      - /srv/homelab/appdata/authentik/certs:/certs
      - /srv/homelab/appdata/authentik/custom-templates:/templates
    networks:
      - authentik-internal

  invitation-provisioner:
    image: docker.io/library/python:3.13-alpine
    container_name: authentik-invitation-provisioner
    restart: unless-stopped
    command: python /app/server.py
    env_file:
      - .env
      - .env.invitation
    environment:
      AUDIOBOOKSHELF_URL: http://audiobookshelf:80
    volumes:
      - ./provisioner:/app:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - authentik-internal
      - homelab

networks:
  authentik-internal:
  homelab:
    external: true
