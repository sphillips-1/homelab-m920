server {
    listen 8080;
    server_name _;

    location = /top-users {
        return 308 /top-users/;
    }

    location = /top-users/health {
        proxy_pass http://top-users:8080/health;
    }

    location /top-users/ {
        # Public requests have already passed the Authentik Status proxy. Do
        # not expose household activity to unauthenticated LAN requests.
        if ($http_x_authentik_username = "") { return 403; }
        proxy_pass http://top-users:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://beszel:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
