services:
  beszel:
    image: ghcr.io/henrygd/beszel/beszel:0.18.8
    container_name: beszel
    restart: unless-stopped

    ports:
      # Private dashboard access from the LAN and Tailscale.
      - "8090:8090"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/monitoring/beszel-data:/beszel_data
      - /srv/homelab/appdata/monitoring/beszel-socket:/beszel_socket

    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://127.0.0.1:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  status-gateway:
    image: nginx:1.29.1-alpine
    container_name: status-gateway
    restart: unless-stopped
    networks:
      - homelab
    volumes:
      - ./status-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      beszel:
        condition: service_healthy
      top-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/top-users/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  top-users:
    image: python:3.13.7-alpine
    container_name: top-users
    restart: unless-stopped
    command: ["python", "/app/top-users.py"]
    networks:
      - homelab
    env_file:
      - path: .top-users.env
        required: false
    volumes:
      - ./top-users.py:/app/top-users.py:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  beszel-agent:
    image: ghcr.io/henrygd/beszel/beszel-agent:0.18.8
    container_name: beszel-agent
    restart: unless-stopped
    profiles: ["agent"]
    network_mode: host

    env_file:
      - path: .env
        # The agent profile is enabled only after this ignored file exists.
        required: false

    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:8090
      SYSTEM_NAME: m920q

    volumes:
      - /srv/homelab/appdata/monitoring/beszel-agent-data:/var/lib/beszel-agent
      - /srv/homelab/appdata/monitoring/beszel-socket:/beszel_socket
      # Read-only access is sufficient to discover and monitor every container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Explicit media-capacity chart, including when media moves to another filesystem.
      - /srv/homelab/storage/.beszel:/extra-filesystems/media__Homelab_Media:ro

    depends_on:
      beszel:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  homelab:
    external: true
