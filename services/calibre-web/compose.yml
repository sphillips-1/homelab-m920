services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York

    ports:
      - "8083:8083"

    volumes:
      - /srv/homelab/appdata/calibre-web:/config
      - /srv/homelab/media/ebooks:/books
