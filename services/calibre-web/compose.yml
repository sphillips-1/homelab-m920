services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York

    ports:
      # Publish to the host LAN and Tailscale interfaces for normal private access.
      - "8083:8083"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/calibre-web:/config
      - /srv/homelab/media/ebooks:/books

    healthcheck:
      test:
        - CMD
        - /lsiopy/bin/python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/', timeout=4).read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  homelab:
    external: true
