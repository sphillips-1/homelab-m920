services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.27-ls395
    container_name: calibre-web
    restart: unless-stopped

    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York

    ports:
      # Publish to the host LAN and Tailscale interfaces for normal private access.
      - "8083:8083"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/calibre-web:/config
      - /srv/homelab/media/ebooks:/books

networks:
  homelab:
    external: true
