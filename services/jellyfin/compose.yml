services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped

    ports:
      # Direct HTTP is LAN-bound. Tailscale Serve uses the Docker network.
      - "${JELLYFIN_LAN_IP}:8096:8096"

    group_add:
      # Generated from the group that owns the selected render device on this host.
      - "${JELLYFIN_RENDER_GID}"

    devices:
      - "${JELLYFIN_RENDER_DEVICE}:${JELLYFIN_RENDER_DEVICE}"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/jellyfin:/config
      - /srv/homelab/cache/jellyfin:/cache
      - /srv/homelab/media/movies:/media/movies:ro
      - /srv/homelab/media/tv:/media/tv:ro

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tailscale:
    image: tailscale/tailscale:v1.104.7
    container_name: jellyfin-tailscale
    restart: unless-stopped
    environment:
      TS_HOSTNAME: jellyfin-m920
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_USERSPACE: "true"
      TS_BOOT_TIMEOUT: 30m
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
    networks:
      - homelab
    volumes:
      - /srv/homelab/appdata/jellyfin-tailscale:/var/lib/tailscale
      - ./tailscale:/etc/tailscale:ro

networks:
  homelab:
    external: true
