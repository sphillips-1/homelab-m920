services:
  jellyfin:
    volumes:
      - type: bind
        source: /srv/homelab/video-data/media/movies
        target: /media/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /srv/homelab/video-data/media/tv
        target: /media/tv
        read_only: true
        bind:
          create_host_path: false
