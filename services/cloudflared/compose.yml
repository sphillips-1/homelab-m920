services:
  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: cloudflared
    restart: unless-stopped
    # The host credential directory is root-owned and mode 0700/0600.
    # Run as root only to read that read-only mount; remove Linux capabilities.
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    healthcheck:
      # The distroless image has no shell or HTTP client. Validate the active
      # ingress configuration with cloudflared's built-in command.
      test: ["CMD", "cloudflared", "tunnel", "--config", "/etc/cloudflared/config.yml", "ingress", "validate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      # Contains the locally generated tunnel credential and rendered ingress config.
      - /srv/homelab/appdata/cloudflared:/etc/cloudflared:ro
    networks:
      - homelab

networks:
  homelab:
    external: true
