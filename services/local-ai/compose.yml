name: local-ai

services:
  ollama:
    image: ollama/ollama:0.40.14
    container_name: local-ai-ollama
    restart: unless-stopped
    cpus: 3.0
    cpu_shares: 256
    mem_limit: 6g
    mem_reservation: 3g
    memswap_limit: 6g
    pids_limit: 256
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_LOAD_TIMEOUT: 5m
    volumes:
      - /srv/homelab/appdata/local-ai/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [local-ai]

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.0
    container_name: local-ai-webui
    restart: unless-stopped
    cpus: 1.0
    cpu_shares: 256
    mem_limit: 2g
    mem_reservation: 512m
    memswap_limit: 2g
    pids_limit: 256
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "true"
      ENABLE_OPENAI_API: "false"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: "false"
      DEFAULT_MODELS: qwen2.5-coder:3b
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
    volumes:
      - /srv/homelab/appdata/local-ai/open-webui:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [local-ai]

networks:
  local-ai:
    driver: bridge
