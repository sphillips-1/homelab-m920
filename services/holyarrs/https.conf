server {
    listen 8443 ssl;
    server_name holyarrs.shelfgoblin.dev;
    ssl_certificate /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    location / {
        set $holyarrs_backend http://holyarrs:6262;
        proxy_pass $holyarrs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
