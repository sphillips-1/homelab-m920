server {
    listen 8443 ssl;
    server_name holyarrs.shelfgoblin.dev;
    ssl_certificate /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    location / {
        proxy_pass http://172.30.93.3:6262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
