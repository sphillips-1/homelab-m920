server {
    listen 8443 ssl;
    server_name holyarrs.shelfgoblin.dev;
    ssl_certificate /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holyarrs.shelfgoblin.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;

    location = /sso/launch {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
        return 200 '<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open HolyArrs</title>
<p>Opening HolyArrs… <a href="/login">Go to sign in</a></p>
<script src="/sso/launch.js" defer></script></html>';
    }

    location = /sso/launch.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '(async () => {
  const options = { credentials: "same-origin", cache: "no-store", signal: AbortSignal.timeout(8000) };
  try {
    const session = await fetch("/api/v1/auth/me", options);
    if (session.ok) {
      window.location.replace("/");
      return;
    }
    if (session.status !== 401) throw new Error("Session check failed");
    const start = await fetch("/api/v1/auth/oidc/start", {
      ...options, method: "POST", headers: { "Content-Type": "application/json" }, body: "{}"
    });
    if (!start.ok) throw new Error("SSO start failed");
    const { auth_url } = await start.json();
    const target = new URL(auth_url);
    if (target.origin !== "https://auth.shelfgoblin.dev" ||
        target.pathname !== "/application/o/authorize/") throw new Error("Unexpected issuer");
    window.location.replace(target.href);
  } catch {
    window.location.replace("/login");
  }
})();';
    }

    location / {
        proxy_pass http://172.30.93.3:6262;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
    }
}
