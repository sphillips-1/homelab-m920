services:
  holyarrs:
    environment:
      HOLYARRS_ALLOWED_HOSTS: holyarrs.shelfgoblin.dev
      HOLYARRS_TRUSTED_PROXIES: 172.30.93.2/32
      HOLYARRS_OIDC_ENABLED: "true"
      HOLYARRS_OIDC_ISSUER: https://auth.shelfgoblin.dev/application/o/holyarrs/
      HOLYARRS_OIDC_CLIENT_ID: holyarrs-lan
      HOLYARRS_OIDC_REDIRECT_URL: https://holyarrs.shelfgoblin.dev/api/v1/auth/oidc/callback
      HOLYARRS_OIDC_ALLOW_JOIN: "true"
    networks:
      homelab: {}
      holyarrs-proxy:
        ipv4_address: 172.30.93.3
  holyarrs-https:
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    ports:
      - "${VIDEO_LAN_IP:-192.168.4.27}:443:8443"
    volumes:
      - /srv/homelab/appdata/holyarrs-tls/https.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/homelab/appdata/holyarrs-tls/live:/etc/letsencrypt/live:ro
      - /srv/homelab/appdata/holyarrs-tls/archive:/etc/letsencrypt/archive:ro
    networks:
      holyarrs-proxy:
        ipv4_address: 172.30.93.2

networks:
  holyarrs-proxy:
    ipam:
      config:
        - subnet: 172.30.93.0/29
