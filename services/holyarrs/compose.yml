name: holyarrs

x-video-mounts:
  data: &video-data
    type: bind
    source: /srv/homelab/video-data
    target: /data
    bind:
      create_host_path: false
  required: &video-storage-required
    type: bind
    # This directory exists only on the mounted SSD. Require it on Docker restarts.
    source: /srv/homelab/video-data/downloads/complete
    target: /video-storage-required
    read_only: true
    bind:
      create_host_path: false

services:
  holyarrs:
    container_name: holyarrs-holyarrs-1
    image: homelab/holyarrs:87d139a
    pull_policy: never
    restart: unless-stopped
    env_file:
      - path: /srv/homelab/appdata/holyarrs-audiobooks/client.env
        required: false
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "027"
      TZ: America/New_York
      HOLYARRS_AUDIOBOOK_QBIT_URL: http://m920-qbittorrent:8093
      HOLYARRS_UPDATES: "off"
    ports:
      - "${VIDEO_LAN_IP:-192.168.4.27}:6262:6262"
    volumes:
      - /srv/homelab/appdata/holyarrs:/config
      - *video-data
      - *video-storage-required
    healthcheck:
      test: ["CMD", "/holyarrs", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homelab

  qbittorrent-video:
    container_name: holyarrs-qbittorrent-video-1
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.14-ls475
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "027"
      TZ: America/New_York
      WEBUI_PORT: "8088"
    ports:
      - "${VIDEO_LAN_IP:-192.168.4.27}:8088:8088"
    volumes:
      - /srv/homelab/appdata/qbittorrent-video:/config
      - *video-data
      - *video-storage-required
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8088/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - homelab

networks:
  homelab:
    external: true
