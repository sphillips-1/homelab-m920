name: readest

services:
  db-config:
    image: supabase/postgres:15.8.1.085
    container_name: readest-db-config
    user: root
    entrypoint: [sh, -c]
    command: ["cp -an /etc/postgresql-custom/. /config/ && chown -R postgres:postgres /config"]
    volumes:
      - /srv/homelab/appdata/readest/postgres-config:/config
  db:
    container_name: readest-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    depends_on:
      db-config:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supabase_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - ./upstream/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./upstream/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - ./upstream/volumes/db/init/schema.sql:/docker-entrypoint-initdb.d/init-scripts/100-schema.sql:ro
      # Incremental migrations on top of the base schema above. The hook name
      # sorts after the image's own migrate.sh, so it runs once the Supabase
      # core schema and 100-schema.sql exist. It globs the mounted directory,
      # so a new migration file needs no compose edit (#5550).
      - ./upstream/volumes/db/migrations:/readest-migrations:ro
      - ./upstream/volumes/db/apply-migrations.sh:/docker-entrypoint-initdb.d/zz-readest-migrations.sh:ro
      - /srv/homelab/appdata/readest/postgres:/var/lib/postgresql/data
      - /srv/homelab/appdata/readest/postgres-config:/etc/postgresql-custom
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal

  kong:
    container_name: readest-kong
    image: kong:2.8.1
    restart: unless-stopped
    volumes:
      - ./upstream/volumes/api/kong.yml:/home/kong/temp.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'

  auth:
    container_name: readest-auth
    image: supabase/gotrue:v2.185.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}

  rest:
    container_name: readest-rest
    image: postgrest/postgrest:v14.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command: ["postgrest"]

  # S3-compatible RustFS replaces the removed official MinIO images.
  minio:
    container_name: readest-storage
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    command: ["/data"]
    volumes:
      - /srv/homelab/appdata/readest/minio:/data
  minio-setup:
    container_name: readest-storage-setup
    image: python:3.12-alpine
    depends_on: [minio]
    command: [python, /app/setup-storage.py]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    volumes:
      - ./setup-storage.py:/app/setup-storage.py:ro

  client:
    container_name: readest-client
    image: ${READEST_IMAGE:-ghcr.io/readest/readest:latest}
    pull_policy: missing
    restart: unless-stopped
    environment:
      SUPABASE_URL: http://kong:8000
      # Browser-facing URLs. The HOST_IP defaults suit a plain IP/port
      # deployment; behind an HTTPS reverse proxy, set them in .env to the
      # single public origin (see README).
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://${HOST_IP}:${KONG_HTTP_PORT:-8000}}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_ADMIN_KEY: ${SERVICE_ROLE_KEY}
      API_BASE_URL: ${SITE_URL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://${HOST_IP}:9000}
      S3_REGION: us-east-1
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_TYPE: ${OBJECT_STORAGE_TYPE:-s3}
      SELF_HOSTED: ${SELF_HOSTED:-true}
      STORAGE_FIXED_QUOTA: ${STORAGE_FIXED_QUOTA:-1073741824}
      TRANSLATION_FIXED_QUOTA: ${TRANSLATION_FIXED_QUOTA:-50000}
      FONT_BASE_URL: ${FONT_BASE_URL:-}
    depends_on:
      - kong
      - minio
  sso:
    image: python:3.12-alpine
    container_name: readest-sso
    restart: unless-stopped
    command: [python, /app/sso.py]
    environment:
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      READEST_ALLOWED_EMAILS: ${READEST_ALLOWED_EMAILS:-}
    volumes:
      - ./sso.py:/app/sso.py:ro
      - ./provision-users.py:/app/provision-users.py:ro
    depends_on:
      - auth
  gateway:
    image: nginx:1.29.1-alpine
    container_name: readest-gateway
    restart: unless-stopped
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, homelab]
    depends_on: [client, kong, minio, sso]

networks:
  default: {}
  homelab:
    external: true
