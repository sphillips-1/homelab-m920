server {
    listen 8080;
    server_name _;
    client_max_body_size 0;
    # Session redirects carry credentials; never record URLs in access logs.
    access_log off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    location = / { return 302 /sso; }
    location = /auth { return 302 /sso; }
    location = /sso {
        proxy_pass http://sso:8081;
        proxy_set_header X-authentik-email $http_x_authentik_email;
    }
    # Admin APIs and alternate login methods are never browser-accessible.
    location ~ ^/auth/v1/(admin|signup|recover|magiclink|otp|authorize|callback|verify)(/|$) { return 403; }
    location ~ ^/(auth|rest)/v1/ { proxy_pass http://kong:8000; }
    location /readest-files/ {
        proxy_pass http://minio:9000;
        proxy_request_buffering off;
    }
    location / { proxy_pass http://client:3000; }
}
