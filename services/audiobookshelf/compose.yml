services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped

    ports:
      # Publish to the host LAN and Tailscale interfaces for normal private access.
      - "13378:80"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/audiobookshelf:/config
      - /srv/homelab/media/audiobooks:/audiobooks
      - /srv/homelab/appdata/audiobookshelf/metadata:/metadata

networks:
  homelab:
    external: true
