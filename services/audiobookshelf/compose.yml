services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    container_name: audiobookshelf
    restart: unless-stopped

    # Explicit upstream for Docker DNS; retain Pi-hole filtering for metadata lookups.
    dns:
      - 192.168.4.75

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/audiobookshelf:/config
      - /srv/homelab/media/audiobooks:/audiobooks
      - /srv/homelab/appdata/audiobookshelf/metadata:/metadata

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  audiobookshelf-gateway:
    image: nginx:1.29.1-alpine
    container_name: audiobookshelf-gateway
    restart: unless-stopped
    ports:
      - "13378:80"
    networks:
      - homelab
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./mobile-app.js:/usr/share/nginx/html/mobile-app.js:ro
    depends_on:
      audiobookshelf:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  homelab:
    external: true
