services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    container_name: audiobookshelf
    restart: unless-stopped

    ports:
      # Publish to the host LAN and Tailscale interfaces for normal private access.
      - "13378:80"

    networks:
      - homelab

    volumes:
      - /srv/homelab/appdata/audiobookshelf:/config
      - /srv/homelab/media/audiobooks:/audiobooks
      - /srv/homelab/appdata/audiobookshelf/metadata:/metadata

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  homelab:
    external: true
