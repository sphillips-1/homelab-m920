map $http_upgrade $abs_connection {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $abs_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 80;
    resolver 127.0.0.11 valid=30s;
    set $abs_backend http://audiobookshelf:80;
    client_max_body_size 0;

    location = /healthz { access_log off; return 200 'ok'; }
    location = /homelab-mobile-app.js {
        alias /usr/share/nginx/html/mobile-app.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location / {
        proxy_pass $abs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $abs_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $abs_connection;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        # Only HTML is modified; API, audio ranges and WebSockets pass through.
        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</head>' '<script defer src="/homelab-mobile-app.js"></script></head>';
    }
}
